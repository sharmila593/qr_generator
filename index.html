<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --bg: #EAEEF4;
    --bg-grid: #DCE3ED;
    --panel: #FFFFFF;
    --ink: #171E2B;
    --ink-soft: #5B6472;
    --line: #C9D2DF;
    --accent: #2F5FE0;
    --accent-ink: #FFFFFF;
    --danger: #C4402B;
    --radius: 10px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151C; --bg-grid: #1A1F29; --panel: #1B212C;
      --ink: #EDF0F5; --ink-soft: #97A1B2; --line: #2C3340;
      --accent: #6B8CFF; --accent-ink: #0E1116;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151C; --bg-grid: #1A1F29; --panel: #1B212C;
    --ink: #EDF0F5; --ink-soft: #97A1B2; --line: #2C3340;
    --accent: #6B8CFF; --accent-ink: #0E1116;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100%;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { margin-bottom: 22px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--ink-soft); font-size: 0.92rem; }

  .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
  }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab {
    border: 1px solid var(--line); background: transparent; color: var(--ink-soft);
    padding: 6px 12px; border-radius: 999px; font-size: 0.82rem; cursor: pointer;
    font-family: inherit;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  label { display: block; font-size: 0.78rem; color: var(--ink-soft); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=url], input[type=tel], input[type=email], textarea, select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font-family: inherit; font-size: 0.92rem;
  }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-group[hidden] { display: none; }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 6px; }
  .opts .full { grid-column: 1 / -1; }
  .swatch-row { display: flex; align-items: center; gap: 8px; }
  input[type=color] { width: 38px; height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .hint { font-size: 0.74rem; color: var(--ink-soft); margin-top: 3px; }

  .preview {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    position: sticky; top: 16px;
  }
  #qrHost {
    background: #fff; padding: 14px; border-radius: var(--radius);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    min-height: 220px; width: 100%; max-width: 320px;
  }
  #qrHost canvas { max-width: 100%; height: auto; display: block; }
  .msg { font-size: 0.8rem; color: var(--ink-soft); text-align: center; }
  .msg.error { color: var(--danger); }

  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button.action {
    border: none; background: var(--accent); color: var(--accent-ink);
    padding: 9px 14px; border-radius: 8px; font-family: inherit; font-size: 0.85rem;
    font-weight: 600; cursor: pointer;
  }
  button.ghost {
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    padding: 9px 14px; border-radius: 8px; font-family: inherit; font-size: 0.85rem; cursor: pointer;
  }
  button:focus-visible, .tab:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .history { margin-top: 18px; }
  .history h2 { font-size: 0.85rem; color: var(--ink-soft); text-transform: none; margin: 0 0 8px; font-weight: 600; }
  .hist-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
  .hist-item {
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.76rem;
    background: var(--bg); cursor: pointer;
  }
  .hist-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-item button { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 0.9rem; line-height: 1; }
  .empty { font-size: 0.78rem; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QR Forge</h1>
    <p>Build a QR code from text, a link, Wi-Fi credentials or a contact card — styled and ready to download.</p>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="tabs" role="tablist" id="typeTabs">
        <button class="tab" role="tab" aria-selected="true" data-type="text">Text / URL</button>
        <button class="tab" role="tab" aria-selected="false" data-type="wifi">Wi-Fi</button>
        <button class="tab" role="tab" aria-selected="false" data-type="contact">Contact</button>
        <button class="tab" role="tab" aria-selected="false" data-type="email">Email</button>
        <button class="tab" role="tab" aria-selected="false" data-type="phone">Phone</button>
      </div>

      <div class="field-group" data-fields="text">
        <label for="f-text">Text or URL</label>
        <textarea id="f-text" placeholder="https://example.com or any text">https://claude.ai</textarea>
      </div>

      <div class="field-group" data-fields="wifi" hidden>
        <label for="f-ssid">Network name (SSID)</label>
        <input id="f-ssid" type="text" placeholder="Home Wi-Fi">
        <label for="f-pass">Password</label>
        <input id="f-pass" type="text" placeholder="••••••••">
        <label for="f-enc">Security</label>
        <select id="f-enc"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">None</option></select>
      </div>

      <div class="field-group" data-fields="contact" hidden>
        <label for="c-name">Full name</label>
        <input id="c-name" type="text" placeholder="Jane Doe">
        <div class="row">
          <div><label for="c-phone">Phone</label><input id="c-phone" type="tel" placeholder="+1 555 010 2020"></div>
          <div><label for="c-email">Email</label><input id="c-email" type="email" placeholder="jane@example.com"></div>
        </div>
        <label for="c-org">Organization</label>
        <input id="c-org" type="text" placeholder="Acme Co">
      </div>

      <div class="field-group" data-fields="email" hidden>
        <label for="e-to">To</label>
        <input id="e-to" type="email" placeholder="hello@example.com">
        <div class="row">
          <div><label for="e-subject">Subject</label><input id="e-subject" type="text"></div>
          <div><label for="e-body">Body</label><input id="e-body" type="text"></div>
        </div>
      </div>

      <div class="field-group" data-fields="phone" hidden>
        <label for="p-number">Phone number</label>
        <input id="p-number" type="tel" placeholder="+1 555 010 2020">
      </div>

      <div class="opts">
        <div>
          <label for="o-ecl">Error correction</label>
          <select id="o-ecl">
            <option value="L">L — low (7%)</option>
            <option value="M" selected>M — medium (15%)</option>
            <option value="Q">Q — quartile (25%)</option>
            <option value="H">H — high (30%)</option>
          </select>
        </div>
        <div>
          <label for="o-size">Size <span id="o-size-val">320</span>px</label>
          <input id="o-size" type="range" min="180" max="640" step="10" value="320">
        </div>
        <div class="swatch-row" style="margin-top:12px">
          <input id="o-fg" type="color" value="#171e2b">
          <label style="margin:0" for="o-fg">Module color</label>
        </div>
        <div class="swatch-row" style="margin-top:12px">
          <input id="o-bg" type="color" value="#ffffff">
          <label style="margin:0" for="o-bg">Background</label>
        </div>
        <div class="full">
          <label for="o-logo">Center logo (optional)</label>
          <input id="o-logo" type="file" accept="image/*">
          <div class="hint">Use error correction Q or H when adding a logo, so the code still scans.</div>
        </div>
      </div>
    </div>

    <div class="panel preview">
      <div id="qrHost"><span class="msg">Enter some content to generate a code</span></div>
      <div class="msg" id="statusMsg"></div>
      <div class="btnrow">
        <button class="action" id="btnPng">Download PNG</button>
        <button class="ghost" id="btnSvg">Download SVG</button>
        <button class="ghost" id="btnSave">Save to history</button>
      </div>

      <div class="history full" style="width:100%">
        <h2>History</h2>
        <div class="hist-list" id="histList"><div class="empty">Nothing saved yet.</div></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const state = { type: 'text', logoData: null };
  const tabsEl = document.getElementById('typeTabs');
  const qrHost = document.getElementById('qrHost');
  const statusMsg = document.getElementById('statusMsg');
  let currentCanvas = null;
  let currentModules = null; // {count, isDark, size, margin, fg, bg}

  tabsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    [...tabsEl.children].forEach(t => t.setAttribute('aria-selected', t === btn ? 'true' : 'false'));
    state.type = btn.dataset.type;
    document.querySelectorAll('[data-fields]').forEach(g => g.hidden = g.dataset.fields !== state.type);
    render();
  });

  document.getElementById('o-size').addEventListener('input', (e) => {
    document.getElementById('o-size-val').textContent = e.target.value;
    render();
  });

  ['o-ecl','o-fg','o-bg'].forEach(id => document.getElementById(id).addEventListener('input', render));
  document.querySelectorAll('#f-text,#f-ssid,#f-pass,#f-enc,#c-name,#c-phone,#c-email,#c-org,#e-to,#e-subject,#e-body,#p-number')
    .forEach(el => el.addEventListener('input', render));

  document.getElementById('o-logo').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) { state.logoData = null; render(); return; }
    const reader = new FileReader();
    reader.onload = () => { state.logoData = reader.result; render(); };
    reader.readAsDataURL(file);
  });

  function escapeVCard(s){ return (s||'').replace(/([,;])/g,'\\$1'); }

  function buildPayload() {
    switch (state.type) {
      case 'text': return document.getElementById('f-text').value.trim();
      case 'wifi': {
        const ssid = document.getElementById('f-ssid').value.trim();
        const pass = document.getElementById('f-pass').value.trim();
        const enc = document.getElementById('f-enc').value;
        if (!ssid) return '';
        return `WIFI:T:${enc};S:${ssid.replace(/([;,:\\])/g,'\\$1')};P:${pass.replace(/([;,:\\])/g,'\\$1')};;`;
      }
      case 'contact': {
        const name = document.getElementById('c-name').value.trim();
        if (!name) return '';
        const phone = document.getElementById('c-phone').value.trim();
        const email = document.getElementById('c-email').value.trim();
        const org = document.getElementById('c-org').value.trim();
        let v = 'BEGIN:VCARD\nVERSION:3.0\n';
        v += `N:${escapeVCard(name)}\nFN:${escapeVCard(name)}\n`;
        if (org) v += `ORG:${escapeVCard(org)}\n`;
        if (phone) v += `TEL:${escapeVCard(phone)}\n`;
        if (email) v += `EMAIL:${escapeVCard(email)}\n`;
        v += 'END:VCARD';
        return v;
      }
      case 'email': {
        const to = document.getElementById('e-to').value.trim();
        if (!to) return '';
        const subject = encodeURIComponent(document.getElementById('e-subject').value.trim());
        const body = encodeURIComponent(document.getElementById('e-body').value.trim());
        return `mailto:${to}?subject=${subject}&body=${body}`;
      }
      case 'phone': {
        const num = document.getElementById('p-number').value.trim();
        return num ? `tel:${num}` : '';
      }
    }
    return '';
  }

  function render() {
    const payload = buildPayload();
    statusMsg.textContent = '';
    statusMsg.className = 'msg';
    if (!payload) {
      qrHost.innerHTML = '<span class="msg">Enter some content to generate a code</span>';
      currentCanvas = null; currentModules = null;
      return;
    }

    const ecl = document.getElementById('o-ecl').value;
    const size = parseInt(document.getElementById('o-size').value, 10);
    const fg = document.getElementById('o-fg').value;
    const bg = document.getElementById('o-bg').value;

    if (state.logoData && (ecl === 'L' || ecl === 'M')) {
      statusMsg.textContent = 'Tip: switch to Q or H so the logo doesn\'t block scanning.';
    }

    let qr;
    try {
      qr = qrcode(0, ecl);
      qr.addData(payload);
      qr.make();
    } catch (err) {
      qrHost.innerHTML = '';
      statusMsg.textContent = 'That content is too long to encode — try shortening it.';
      statusMsg.className = 'msg error';
      currentCanvas = null; currentModules = null;
      return;
    }

    const count = qr.getModuleCount();
    const margin = 2; // quiet-zone modules
    const totalModules = count + margin * 2;
    const cell = size / totalModules;

    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = fg;
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell + 0.6, cell + 0.6);
        }
      }
    }

    function finish() {
      qrHost.innerHTML = '';
      qrHost.appendChild(canvas);
      currentCanvas = canvas;
      currentModules = { qr, count, margin, size, fg, bg };
    }

    if (state.logoData) {
      const img = new Image();
      img.onload = () => {
        const logoSize = size * 0.22;
        const pad = logoSize * 0.16;
        const x = (size - logoSize) / 2, y = (size - logoSize) / 2;
        ctx.fillStyle = bg;
        ctx.fillRect(x - pad, y - pad, logoSize + pad * 2, logoSize + pad * 2);
        ctx.drawImage(img, x, y, logoSize, logoSize);
        finish();
      };
      img.src = state.logoData;
    } else {
      finish();
    }
  }

  function buildSvg() {
    if (!currentModules) return null;
    const { qr, count, margin, size, fg, bg } = currentModules;
    const totalModules = count + margin * 2;
    const cell = size / totalModules;
    let rects = '';
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          rects += `<rect x="${((c + margin) * cell).toFixed(2)}" y="${((r + margin) * cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}"/>`;
        }
      }
    }
    let logoTag = '';
    if (state.logoData) {
      const logoSize = size * 0.22, pad = logoSize * 0.16, x = (size - logoSize) / 2, y = (size - logoSize) / 2;
      logoTag = `<rect x="${(x-pad).toFixed(2)}" y="${(y-pad).toFixed(2)}" width="${(logoSize+pad*2).toFixed(2)}" height="${(logoSize+pad*2).toFixed(2)}" fill="${bg}"/>` +
                `<image href="${state.logoData}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${logoSize.toFixed(2)}" height="${logoSize.toFixed(2)}"/>`;
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">` +
           `<rect width="${size}" height="${size}" fill="${bg}"/><g fill="${fg}">${rects}</g>${logoTag}</svg>`;
  }

  let downloadsApi = null;
  window.claude?.use && window.claude.use('downloads').then(d => downloadsApi = d).catch(() => {});

  async function offerDownload(filename, blobData, mime) {
    if (!currentCanvas && !currentModules) return;
    if (downloadsApi) {
      try {
        await downloadsApi.save({ filename, data: blobData });
        return;
      } catch (err) { /* fall through */ }
    }
    statusMsg.textContent = 'Downloads aren\'t available in this view — try opening the artifact directly.';
    statusMsg.className = 'msg error';
  }

  document.getElementById('btnPng').addEventListener('click', () => {
    if (!currentCanvas) return;
    currentCanvas.toBlob(async (blob) => {
      const buf = await blob.arrayBuffer();
      offerDownload('qr-code.png', buf, 'image/png');
    }, 'image/png');
  });

  document.getElementById('btnSvg').addEventListener('click', () => {
    const svg = buildSvg();
    if (!svg) return;
    offerDownload('qr-code.svg', svg, 'image/svg+xml');
  });

  // History (per-viewer, localStorage)
  const histList = document.getElementById('histList');
  function loadHistory() {
    try {
      const raw = localStorage.getItem('qrforge-history');
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveHistory(list) {
    try { localStorage.setItem('qrforge-history', JSON.stringify(list.slice(0, 12))); } catch (e) {}
  }
  function renderHistory() {
    const list = loadHistory();
    if (!list.length) { histList.innerHTML = '<div class="empty">Nothing saved yet.</div>'; return; }
    histList.innerHTML = '';
    list.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'hist-item';
      row.innerHTML = `<span title="${item.payload.replace(/"/g,'&quot;')}">${item.label}</span>`;
      const del = document.createElement('button');
      del.textContent = '✕';
      del.setAttribute('aria-label', 'Remove');
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        const l = loadHistory(); l.splice(i, 1); saveHistory(l); renderHistory();
      });
      row.appendChild(del);
      row.addEventListener('click', () => {
        [...tabsEl.children].forEach(t => t.setAttribute('aria-selected', t.dataset.type === item.type ? 'true' : 'false'));
        state.type = item.type;
        document.querySelectorAll('[data-fields]').forEach(g => g.hidden = g.dataset.fields !== state.type);
        if (item.type === 'text') document.getElementById('f-text').value = item.payload;
        render();
      });
      histList.appendChild(row);
    });
  }

  document.getElementById('btnSave').addEventListener('click', () => {
    const payload = buildPayload();
    if (!payload) return;
    const list = loadHistory();
    const label = payload.length > 40 ? payload.slice(0, 40) + '…' : payload;
    list.unshift({ type: state.type, payload, label, at: Date.now() });
    saveHistory(list);
    renderHistory();
    statusMsg.textContent = 'Saved to history.';
    statusMsg.className = 'msg';
  });

  renderHistory();
  render();
})();
</script>
</body>
</html>
